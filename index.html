<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SREYMARA Ecosystem V5.0 | Premium Executive Engine</title>
  <script src="https://cdn.tailwindcss.com/3.4.1"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <script>
    if (typeof AndroidBridge === 'undefined') {
        window.AndroidBridge = {
            log: (level, msg) => console.log(`[SREYMARA WEB LOG ${level}]`, msg),
            onMainButtonStateChanged: (json) => console.log("[SREYMARA WEB] Main Button:", json),
            onBackButtonStateChanged: (visible) => console.log("[SREYMARA WEB] Back Button:", visible),
            onSendDataReceived: (data) => console.log("[SREYMARA WEB] Send Data:", data),
            onCloseRequested: () => console.log("[SREYMARA WEB] Close Requested"),
            onShowAlertRequested: (msg) => alert(`[SREYMARA ALERT]: ${msg}`)
        };
    }
  </script>
</head>
<body style="background-color: #04060B; color: #F8FAFC; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
